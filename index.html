<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Listeners Lab</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1>Event Listeners in JavaScript</h1>

  <!-- Task: Button to change background color -->
  <button id="color-btn">Change Background Color</button>
  <p>Double-click anywhere on the page to reset the background color.</p>

  <!-- Task: Key press display -->
  <div>
    <h2>Key Press Display</h2>
    <p id="key-display">Press any key...</p>
  </div>

  <!-- Task: Text input display -->
  <div>
    <h2>User Input Display</h2>
    <input type="text" id="user-input" placeholder="Type something...">
    <p id="input-display"></p>
  </div>

  <script src="index.js"></script>
</body>
</html>
